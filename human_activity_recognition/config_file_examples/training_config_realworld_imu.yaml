general:
  project_name: human_activity_recognition
  logs_dir: logs
  saved_models_dir: saved_models
  display_figures: True
  global_seed: 123

operation_mode: training

dataset:
  dataset_name: realworld_imu
  # Edit to four activity strings in your CSV, in desired output order.
  class_names: [walking, running, climbing_stairs, standing]
  training_path: ./datasets/realworld_imu/merged.csv
  validation_split: 0.2
  test_split: 0.2
  seed: 123

preprocessing:
  gravity_rot_sup: False
  normalization: True

model:
  model_name: st_ign
  input_shape: (24, 6, 1)
  dropout: 0.5

training:
  batch_size: 128
  epochs: 100
